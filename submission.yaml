submission:
  title: "D2 Threat Intelligence Correlation & Alert Prioritisation Engine"
  problem_statement: "Defense analysts receive thousands of unstructured alerts daily from SIEM systems, satellite feeds, and cyber sensors. No human team can parse them all in real time, causing critical threats to be missed while false positives consume valuable triage resources."
  solution_summary: "We built an intelligent data normalization pipeline and scoring engine that aggregates multi-source threat telemetry, correlates indicators, and maps malicious behaviors onto the MITRE ATT&CK framework. The backend integrates an MCP server configuration leveraging watsonx.ai to auto-generate actionable Bottom Line Up Front (BLUF) summaries for operational commanders."
  key_features:
    - "Multi-source log normalization ingesting SIEM, satellite, cyber sensor, and intelligence feeds into a single core schema."
    - "Algorithmic alert threat prioritization scoring based on signal confidence, anomaly severity, and asset criticality."
    - "Dynamic interactive MITRE ATT&CK matrix mapping for real-time visual tracking of adversary behaviors."
    - "Model Context Protocol (MCP) tool hosting to expose analytic triage pipelines to active LLM orchestration layers."
    - "Automated commander-ready BLUF text report generation using watsonx.ai framework abstractions."
  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit"]
    ibm_technologies: ["watsonx.ai", "IBM Bob", "Granite Models", "Model Context Protocol"]
    databases: ["Pandas SessionState"]
    other: ["Plotly Data Visualization", "Git Workflow"]
  what_we_are_most_proud_of: "We are proud of building a fully responsive, functional analytics correlation pipeline from multi-source data and embedding an LLM orchestration pattern that successfully outputs actionable commander insights within seconds."
  known_limitations: "The application currently works in simulation mode using local telemetry configurations; production deployments require direct live data streaming endpoints and active production credentials for large language model environments."

