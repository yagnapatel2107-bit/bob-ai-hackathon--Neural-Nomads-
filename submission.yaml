submission:
  title: "AI-Powered Cyber Threat Intelligence and False-Positive Filtering"

  problem_statement: >
    Security teams receive large amounts of threat intelligence from SIEM
    systems, satellite reports, cyber reports, and other security feeds.
    Manually filtering false positives, identifying relevant threats, mapping
    them to MITRE ATT&CK, and preparing useful summaries can take significant
    time and effort.

  solution_summary: >
    We are building an AI-assisted cyber threat intelligence solution that
    analyzes security reports and threat feeds, helps identify and filter
    potential false positives, maps threats to the MITRE ATT&CK framework,
    and generates concise BLUF summaries so analysts can understand and
    prioritize threats more quickly.

  key_features:
    - "AI-assisted false-positive filtering"
    - "MITRE ATT&CK threat and technique mapping"
    - "BLUF (Bottom Line Up Front) threat summaries"
    - "Analysis of cyber threat feeds and security reports"
    - "Threat prioritization for security analysts"

  tech_stack:
    languages:
      - "Python"
    frameworks: []
    ibm_technologies:
      - "IBM watsonx.ai"
      - "IBM Bob"
    databases: []
    other:
      - "Claude"
      - "GitHub"
      - "GitHub Desktop"
      - "Visual Studio Code"
      - "MITRE ATT&CK"

  what_we_are_most_proud_of: >
    We are most proud of creating an AI-assisted workflow that brings together
    threat intelligence analysis, false-positive filtering, MITRE ATT&CK
    mapping, and BLUF summaries. By using IBM watsonx.ai, IBM Bob, and Claude
    during development, we aim to make complex cyber threat information easier
    to analyze and prioritize.

  known_limitations: >
    The project was developed within a hackathon time limit, so the current
    system may have limitations in the number of threat sources and datasets
    it can process. AI-generated classifications and MITRE ATT&CK mappings
    may also require human verification, and additional testing with larger
    real-world security datasets would be needed before production deployment.

